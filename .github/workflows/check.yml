# The second reader for everything this repository states about itself.
#
# AGENTS.md says a declared contract stays true only while a second reader
# enforces it. Three of this repository's checks were run because a rule said
# to, which makes the person the reader -- and a person who forgets leaves no
# trace. This runs them on every pull request instead.
#
# Three constraints on this file, because breaking any of them is quiet:
#
#   1. Never add `paths`, `paths-ignore`, or a `branches` filter to the
#      `pull_request` trigger. A required check that a pull request does not
#      produce is never "skipped" -- it stays pending forever, and with
#      `enforce_admins` there is no override. A prose-only branch must still
#      produce this check.
#   2. Keep the job named `check`, and keep this file parseable. The required
#      context is the job name, so renaming it, deleting this file, or leaving
#      it unparseable produces no `check` at all -- which is pending forever,
#      not red. A job that *fails* is fine: the context is reported, and a push
#      clears it. Recovering an absent context means pushing one back; only a
#      pull request that means to remove the check needs an admin to empty
#      `required_status_checks.contexts` on `main`, land it, and restore them.
#   3. Every `uses:` names a 40-character commit sha, never a tag, with the
#      release in a trailing comment. A tag is mutable, so an unpinned `uses:`
#      lets its owner change what every merge into `main` runs.
#
# It is also what makes branch protection bite. `strict` ("require branches to
# be up to date") is a modifier on required status checks, so with no checks it
# enforces nothing: measured 2026-08-30 on a branch one commit behind `main`,
# which read MERGEABLE/CLEAN with `strict: true` and `contexts: []`. Naming this
# job in `required_status_checks.contexts` is what gives merge condition 3 a
# reader.

name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # The review gate below reads a pull request's comments. `contents: read`
  # does not carry them, and the gate answers `unknown` rather than passing
  # when it cannot look -- which fails the job for the wrong reason.
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0`, not the default 1. The tie guard below asks whether
      # HEAD contains `origin/main`, and in a shallow clone HEAD's parents are
      # grafted away so the answer is always no -- which made the guard permit
      # on every run while its log read like a verdict. Ancestry needs history.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      # check-commit-claim.py is deliberately absent: it refuses a branch that
      # is not a claim, and a pull request runner's branch never is.
      - name: The three guards that read the tree, as the pre-commit runs them
        run: |
          scripts/check-rule-readers.py
          scripts/check-tree-shape.py
          scripts/check-cross-references.py

      # The fourth guard, and the one reading the pre-commit cannot give it. It
      # judges a change against a tree, and the runner's HEAD is the merge
      # commit -- against HEAD there is nothing left to judge, which is why this
      # step did not exist until #268 and why a `--no-verify` commit landed a
      # T1, T2 or T3 unread. `--against origin/main` makes the before-tree the
      # base branch, so what is judged is the pull request's whole change rather
      # than its last commit.
      #
      # The fetch is its own step because `actions/checkout` leaves no
      # `origin/main` ref on a pull request even at full depth. NOT `--depth=1`:
      # the guard reads two trees AND asks whether HEAD contains the ref, and a
      # shallow fetch answers that question no every time.
      - name: The tie guard, over the whole change rather than one commit
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          scripts/check-sdlc-tie.py --against origin/main

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      # Pinned to the release asset, not to a package manager: this is the same
      # build the machine runs, which is what makes a green run here mean what a
      # green run there means. Identity is the sha256 below, verified on every
      # run. A size match is not identity, and the cache is not trustworthy on
      # its own -- any branch can seed this key, so a restored jar is checked
      # exactly like a downloaded one.
      - name: Cache the Alloy jar
        id: alloy-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.local/share/alloy/alloy-6.2.0.jar
          key: alloy-6.2.0-dist-jar

      - name: Fetch the Alloy jar
        if: steps.alloy-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/share/alloy
          curl -fsSL -o ~/.local/share/alloy/alloy-6.2.0.jar \
            https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/org.alloytools.alloy.dist.jar

      # Runs on both paths, cache hit and fresh download alike.
      - name: The jar is the build this repository checks against
        run: |
          echo "6b8c1cb5bc93bedfc7c61435c4e1ab6e688a242dc702a394628d9a9801edb78d  $HOME/.local/share/alloy/alloy-6.2.0.jar" \
            | sha256sum -c -

      # The same wrapper this machine has on PATH, so alloy-check is invoked
      # exactly as a person invokes it rather than through a CI-only spelling.
      - name: Install the alloy wrapper
        run: |
          mkdir -p ~/.local/bin
          cat > ~/.local/bin/alloy <<'SH'
          #!/bin/sh
          exec java -Djava.awt.headless=true \
            -jar "$HOME/.local/share/alloy/alloy-6.2.0.jar" "$@"
          SH
          chmod +x ~/.local/bin/alloy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # After the Alloy install, not before it: alloy-check-test.py runs the
      # real solver on its fixtures, and a suite with no alloy fails red here
      # rather than passing on a stand-in.
      #
      # Every suite, found rather than listed: a hand-kept list is one more copy
      # to forget, and the five suites #111 added were run by nobody here until
      # a review noticed. A suite that exits non-zero fails the job; a run that
      # finds no suite at all fails it too, since an empty loop is green.
      # `*-test.*`, not `*-test.py`: the `-test` element is what names a suite
      # and the extension names its language, so a shell suite is found too
      # rather than silently skipped by a glob that pins one interpreter.
      # Both scripts/ roots, the repository's and each skill's: check-sdlc-tie
      # reads a tie through a suite in either, and a tie through a suite this
      # loop never ran would be a name and nothing else. Two shell globs under
      # nullglob, not `find`: a glob never spans a slash, so nothing nested is
      # taken, a root with no suite contributes nothing rather than a literal,
      # and there is no command substitution whose status the loop drops.
      - name: Every suite
        run: |
          shopt -s nullglob
          n=0
          for t in scripts/*-test.* .claude/skills/*/scripts/*-test.*; do
            echo "== $t"
            "$t" || exit 1
            n=$((n + 1))
          done
          [ "$n" -gt 0 ] || { echo "no suite was found under scripts/ or .claude/skills/*/scripts/"; exit 1; }
          echo "$n suite(s) ran"

      # Seconds, and it needs no solver, so it runs before the slow step: a
      # deleted command is the one thing the `expect` clauses below cannot
      # catch, having no clause left to miss.
      - name: The command snapshot still names every declared command
        run: scripts/alloy-check.py --commands spec

      # Every module of every entity under the spec/ root, system modules
      # included: one that no
      # longer parses is a failure the two sibling modules would report only
      # indirectly, and a system module declares no command so running it costs
      # one trivial `Default`. `find`, not a depth-2 glob: the step above
      # inventories to any depth, and a module the inventory sees but this loop
      # misses is one whose commands nothing here runs. A run that finds no
      # module fails the job, since an empty loop is green. The same run
      # refuses a check over an event no witness shows firing, which its
      # `expect` cannot see (alloy-check.py, THE DEAD EVENT).
      - name: Every command comes out as its `expect` clause says
        run: |
          n=0
          for m in $(find spec -name '*.als' | sort); do
            echo "== $m"
            scripts/alloy-check.py "$m" || exit 1
            n=$((n + 1))
          done
          [ "$n" -gt 0 ] || { echo "no .als module was found under spec"; exit 1; }
          echo "$n module(s) ran"

      # MERGE CONDITION 1, GIVEN A READER (kalaluthien/campaign-base#274).
      # AGENTS.md wants a review read at the sha being merged; nothing read it,
      # and PR #262 merged at 8ca2609 with no REVIEW comment on it at all. This
      # is the required-status half: with `check` in
      # `required_status_checks.contexts` on `main`, a merge without a REVIEW
      # at the head is refused by GitHub rather than by whoever remembers.
      #
      # LAST, and that is the whole placement argument. A pull request with no
      # review yet is the ORDINARY state of one just pushed, so a gate running
      # first would paint every fresh push red over the one thing that is not
      # about the code, and hide the guards and the suites behind it. Running
      # last, everything that judges the change has already reported.
      #
      # `if:` ON THE STEP, never a filter on the trigger. The job still runs on
      # a push to `main` and still reports the `check` context; only this step
      # stands down, because a push has no pull request to read comments on.
      # Constraint 1 at the head of this file is about the trigger and this does
      # not touch it.
      #
      # It answers `unreviewed` (1) or `unknown` (2) on the same non-zero
      # status, and both fail the job on purpose: a pull request whose comments
      # went unread is not a pull request with a review on it.
      #
      # `--head` IS NOT OPTIONAL HERE. The status this step produces is recorded
      # against `github.event.pull_request.head.sha`, and without the flag the
      # reader would answer about whatever the branch tip is when the runner
      # gets there. Those come apart: a run queued for sha A while the author
      # pushes B and posts a REVIEW naming B would mark A green with nothing
      # ever naming A. Naming the sha makes the run's verdict about the run's
      # own commit.
      #
      # A comment fires no `pull_request` event, so review-rerun.yml re-runs
      # this job once a REVIEW names the head.
      - name: A REVIEW at the head sha, which is merge condition 1
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/check-merge-review.py ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --head ${{ github.event.pull_request.head.sha }}
